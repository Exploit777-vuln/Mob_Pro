<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Fundamentals Example</title>
</head>

<body>

    <h2>JavaScript Basics Demo</h2>
    <p id="output"></p>

    <button onclick="showResult()">Click Here</button>

    <script>
        // Program created by Aditya Rai

        function showResult() {
            let x = 10;
            let y = 5;
            let result = x * y;

            if (result % 2 === 0) {
                document.getElementById("output").innerHTML =
                    "The result is " + result + ". It is an even number.";
            } else {
                document.getElementById("output").innerHTML =
                    "The result is " + result + ". It is an odd number.";
            }
        }
    </script>

    <p><strong>Made by Aditya Rai</strong></p>

</body>
</html>

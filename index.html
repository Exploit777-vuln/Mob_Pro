<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ID and Class Example</title>

    <style>
        /* Main wrapper that holds everything */
        #wrapper {
            width: 100%;
            padding: 20px;
            border: 2px solid #caff00;
        }

        /* Common style for all boxes */
        .box {
            padding: 12px;
            margin: 8px 0;
            color: white;
            font-weight: bold;
        }

        /* Individual styling using IDs (unique elements) */
        #box1 { background-color: #e74c3c; }
        #box2 { background-color: #3498db; }
        #box3 { background-color: #2ecc71; }
        #box4 { background-color: #f1c40f; }
        #box5 { background-color: #9b59b6; }
        #box6 { background-color: #e67e22; }
        #box7 { background-color: #1abc9c; }
        #box8 { background-color: #34495e; }

        /* Shared style using class (can be reused) */
        .common-box {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div id="wrapper">
        <h1 style="text-align: center;">Using 8 IDs and 1 Shared Class by Aditya Rai</h1>

        <!-- Boxes with unique IDs -->
        <div id="box1" class="box">Box 1 (Unique ID)</div>
        <div id="box2" class="box">Box 2 (Unique ID)</div>
        <div id="box3" class="box">Box 3 (Unique ID)</div>
        <div id="box4" class="box">Box 4 (Unique ID)</div>
        <div id="box5" class="box">Box 5 (Unique ID)</div>
        <div id="box6" class="box">Box 6 (Unique ID)</div>
        <div id="box7" class="box">Box 7 (Unique ID)</div>
        <div id="box8" class="box">Box 8 (Unique ID)</div>

        <!-- Boxes sharing the same class -->
        <div class="box common-box">Shared Box A (Class)</div>
        <div class="box common-box">Shared Box B (Class)</div>
    </div>

</body>
</html>
